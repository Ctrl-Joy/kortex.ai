[project]
name = "kortex-api"
version = "1.0.0"
description = "KORTEX AI — scan-and-go reconciliation API (hackathon prototype)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "sqlalchemy>=2.0,<2.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108", "E501", "UP046", "UP040"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
