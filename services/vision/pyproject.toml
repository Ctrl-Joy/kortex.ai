[project]
name = "kortex-vision"
version = "1.0.0"
description = "KORTEX AI — local webcam vision service (YOLO + IoU tracker + shelf-zone heuristic)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ultralytics>=8.3,<9",
    "torch>=2.4",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
