# Render Blueprint — deploys both the API and web app from one repo.
# Render → New → Blueprint → pick this repository.
# The vision service stays on the demo laptop (needs a webcam).
services:
  # ---- Backend API (FastAPI + SQLite) ----
  - type: web
    name: kortex-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    # Seeding is idempotent. The free plan has no persistent disk, so the SQLite
    # database starts fresh (with seeded demo data) after each deploy/restart.
    startCommand: python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KORTEX_ENVIRONMENT
        value: production
      - key: KORTEX_DATABASE_URL
        value: sqlite:///./data/kortex.db
      - key: KORTEX_SECRET_KEY
        generateValue: true
      - key: KORTEX_VISION_API_KEY
        generateValue: true
      - key: KORTEX_SEED_STAFF_PASSWORD
        sync: false
      - key: KORTEX_CORS_ORIGINS
        fromService:
          name: kortex-web
          type: web
          property: host
        # Render sets this to the web service's URL automatically.
        # Format: https://kortex-web-xxxx.onrender.com
      - key: KORTEX_CORS_ORIGIN_REGEX
        sync: false

  # ---- Frontend (React / Vite static site) ----
  - type: web
    name: kortex-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: kortex-api
          type: web
          property: host
        # Render wires this to the API URL automatically.
